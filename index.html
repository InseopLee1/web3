<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>두근두근 교실 자리 바꾸기 🎲</title>
  <!-- 엑셀(.xlsx) 파일 분석을 위한 SheetJS 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* 🌟 테마 색상 정의 */
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary: #4a90e2;
      --primary-hover: #357abd;
      --accent: #ff6b6b;
      --border-color: #e0e0e0;
      --seat-bg: #eef2f7;
      --seat-border: #ccd6e0;
      --seat-text: #2c3e50;
      --board-bg: #34495e;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    /* 🌙 다크 모드 색상 */
    [data-theme="dark"] {
      --bg-color: #1a1c23;
      --card-bg: #24283b;
      --text-color: #f1f2f6;
      --primary: #5c7cfa;
      --primary-hover: #4263eb;
      --accent: #ff8787;
      --border-color: #3b4261;
      --seat-bg: #2e3440;
      --seat-border: #434c5e;
      --seat-text: #eceff4;
      --board-bg: #1e222a;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 🎛️ 상단 컨트롤 바 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .theme-toggle-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 1.2rem;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* ⚙️ 설정 패널 */
    .panel {
      background: var(--card-bg);
      padding: 20px 24px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    label {
      font-weight: bold;
      font-size: 0.95rem;
    }

    input[type="number"], select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      outline: none;
      width: 80px;
    }

    .file-upload-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="file"] {
      font-size: 0.9rem;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button.btn {
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-reset { background: var(--accent); color: white; }
    .btn-reset:hover { opacity: 0.9; }

    /* 🏫 교실 배치 화면 */
    .classroom-board {
      background: var(--board-bg);
      color: #ffffff;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .seats-grid {
      display: grid;
      gap: 14px;
      margin-top: 10px;
      justify-content: center;
    }

    /* 🪑 책상 카드 */
    .seat {
      background: var(--seat-bg);
      border: 2px solid var(--seat-border);
      color: var(--seat-text);
      min-height: 70px;
      min-width: 90px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 600;
      font-size: 1.05rem;
      user-select: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      position: relative;
    }

    .seat .seat-num {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 0.75rem;
      opacity: 0.6;
    }

    /* 🌪️ 섞기 애니메이션 */
    @keyframes shuffleSpin {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.08) rotate(3deg); opacity: 0.7; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .shuffling {
      animation: shuffleSpin 0.25s infinite ease-in-out;
      border-color: var(--primary) !important;
      color: var(--primary) !important;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 상단 타이틀 & 다크모드 -->
  <header>
    <h1>🎲 자리 바꾸기</h1>
    <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()">🌙 다크 모드</button>
  </header>

  <!-- 설정 패널 -->
  <section class="panel">
    <div class="input-row">
      <label>열(가로 분단 수):</label>
      <input type="number" id="colsInput" value="5" min="1" max="10">
      
      <label>행(세로 줄 수):</label>
      <input type="number" id="rowsInput" value="5" min="1" max="10">
      
      <button class="btn btn-primary" onclick="initSeats()">배치 틀 잡기</button>
    </div>

    <div class="input-row file-upload-box">
      <label>엑셀 명단 파일 업로드:</label>
      <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="startShuffle()">✨ 자리 섞기 시작!</button>
      <button class="btn btn-reset" onclick="resetSeats()">🔄 초기화</button>
    </div>
    <small id="statusText" style="color: var(--primary); font-weight: 600;"></small>
  </section>

  <!-- 교실 배치도 -->
  <div class="classroom-board">칠 판 (앞)</div>
  <div class="seats-grid" id="seatsGrid"></div>
</div>

<script>
  // 기본 학생 명단 샘플 (엑셀을 안 올렸을 때 기본 적용)
  let studentList = [
    "김민준", "이서준", "박예준", "최도윤", "정시우",
    "강주원", "조하준", "윤지호", "장지후", "임준우",
    "한서아", "오이서", "서하윤", "신아윤", "권지아",
    "황서윤", "안채원", "송하은", "류윤서", "홍서연"
  ];

  // 1. 다크모드 토글 기능
  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const themeBtn = document.getElementById('themeBtn');
    
    if (currentTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'light');
      themeBtn.textContent = '🌙 다크 모드';
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️ 라이트 모드';
    }
  }

  // 2. 자리 배치 판 생성
  function initSeats() {
    const cols = parseInt(document.getElementById('colsInput').value) || 5;
    const rows = parseInt(document.getElementById('rowsInput').value) || 5;
    const grid = document.getElementById('seatsGrid');

    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.innerHTML = '';

    const totalSeats = cols * rows;
    for (let i = 0; i < totalSeats; i++) {
      const seat = document.createElement('div');
      seat.classList.add('seat');
      seat.id = `seat-${i}`;
      
      const numSpan = document.createElement('span');
      numSpan.classList.add('seat-num');
      numSpan.innerText = `${i + 1}`;
      
      const nameSpan = document.createElement('span');
      nameSpan.classList.add('student-name');
      nameSpan.innerText = '-';

      seat.appendChild(numSpan);
      seat.appendChild(nameSpan);
      grid.appendChild(seat);
    }
    document.getElementById('statusText').innerText = `총 ${totalSeats}개 자리가 준비되었습니다.`;
  }

  // 3. 엑셀 파일 읽기 (SheetJS)
  document.getElementById('excelFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const data = new Uint8Array(event.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      
      // 첫 번째 시트 선택
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      
      // 시트 내용을 배열로 변환
      const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
      
      // 1열(A열)을 이름 목록으로 가져오기 (빈칸 제외)
      const names = json.flat().filter(name => name && String(name).trim() !== "");

      if (names.length > 0) {
        studentList = names;
        document.getElementById('statusText').innerText = `✅ 명단 등록 완료: 총 ${studentList.length}명 확인!`;
      } else {
        alert("엑셀 파일에 이름 데이터를 찾을 수 없어요!");
      }
    };
    reader.readAsArrayBuffer(file);
  });

  // 4. 자리 섞기 애니메이션 & 랜덤 배치
  let isShuffling = false;

  function startShuffle() {
    if (isShuffling) return;
    isShuffling = true;

    const seatCards = document.querySelectorAll('.seat');
    const nameSpans = document.querySelectorAll('.student-name');

    if (seatCards.length === 0) {
      alert("배치 틀을 먼저 만들어 주세요!");
      isShuffling = false;
      return;
    }

    // 카드 흔들림 애니메이션 효과 주기
    seatCards.forEach(seat => seat.classList.add('shuffling'));

    let count = 0;
    const maxTicks = 20; // 섞이는 횟수
    const intervalTime = 100; // 0.1초마다 랜덤 이름 표시

    const interval = setInterval(() => {
      nameSpans.forEach(span => {
        const randName = studentList[Math.floor(Math.random() * studentList.length)];
        span.innerText = randName || "빈자리";
      });

      count++;
      if (count >= maxTicks) {
        clearInterval(interval);
        finalizeSeats(); // 최종 자리 확정
      }
    }, intervalTime);
  }

  // 5. 최종 확정 자리 배치 (피셔-예이츠 셔플 알고리즘)
  function finalizeSeats() {
    const seatCards = document.querySelectorAll('.seat');
    const nameSpans = document.querySelectorAll('.student-name');

    // 학생 명단 복사 후 섞기
    let shuffled = [...studentList];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    // 자리 채우기
    seatCards.forEach((seat, index) => {
      seat.classList.remove('shuffling');
      nameSpans[index].innerText = shuffled[index] ? shuffled[index] : "빈자리";
    });

    isShuffling = false;
    document.getElementById('statusText').innerText = "🎉 새로운 자리가 확정되었습니다!";
  }

  // 6. 초기화
  function resetSeats() {
    const nameSpans = document.querySelectorAll('.student-name');
    nameSpans.forEach(span => {
      span.innerText = '-';
    });
    document.getElementById('statusText').innerText = "자리 배치가 초기화되었습니다.";
  }

  // 첫 화면 로딩 시 자동 틀 구성
  window.onload = function() {
    initSeats();
  };
</script>

</body>
</html>
